# it check python syntax with flake 8 libararies.

name: python lint

on:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"   # use stable version

      - name: Install dependencies
        run: |
          pip install flake8
          pip install -r requirements.txt 

      - name: Run linter
        run: flake8 app.py