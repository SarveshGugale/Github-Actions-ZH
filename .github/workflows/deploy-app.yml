name: Deploy Flask App

on:
  workflow_dispatch:

jobs:
  Deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          docker pull sarvesh01234/github-actions-app:latest
          docker compose down
          docker compose up -d --force-recreate
          