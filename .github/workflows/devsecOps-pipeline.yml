name: DevSecOps End to End Pipeline

on:
  push:
    branches: [main]

jobs:
  code-quality:
    uses: ./.github/workflows/code-quality.yml

  secrets-scan:
    uses: ./.github/workflows/secrets-scan.yml

  dependency-scan:
    uses: ./.github/workflows/dependency-scan.yml

  docker-scan:
    uses: ./.github/workflows/docker-file-scan.yml

  # build:
  #   needs: [code-quality, secrets-scan, dependency-scan, docker-scan]
  #   uses: ./.github/workflows/docker-build-push.yml
  #   secrets: inherit

  build:
    needs: [code-quality, secrets-scan, dependency-scan, docker-scan]
    uses: ./.github/workflows/docker-build-push.yml
    secrets: inherit

  trivy:
    needs: [build]
    uses: ./.github/workflows/image-scan.yml
    secrets: inherit

  deploy-dev:
    needs: trivy
    uses: ./.github/workflows/update-gitops.yml
    with:
      environment:  dev
    secrets: inherit

  deploy-stage:
    needs: deploy-dev
    uses: ./.github/workflows/update-gitops.yml
    with:
      environment:  stage
    secrets: inherit

  deploy-prod:
    needs: deploy-stage
    uses: ./.github/workflows/update-gitops.yml
    with:
      environment:  prod
    secrets: inherit  
