<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpaceX Mission Control</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#050816;
    color:white;
    overflow-x:hidden;
}

.hero{
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:
    linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.8)),
    url("https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?auto=format&fit=crop&w=1600&q=80");
    background-size:cover;
    background-position:center;
}

.hero h1{
    font-size:5rem;
    color:#00d4ff;
}

.hero p{
    font-size:1.4rem;
    margin-top:20px;
}

.btn{
    margin-top:30px;
    padding:15px 35px;
    background:#00d4ff;
    color:black;
    text-decoration:none;
    border-radius:30px;
    font-weight:bold;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:60px;
}

.card{
    background:#10192b;
    padding:30px;
    border-radius:15px;
    text-align:center;
    transition:.3s;
}

.card:hover{
    transform:translateY(-10px);
}

.card h2{
    color:#00d4ff;
    margin-bottom:10px;
}

.gallery{
    padding:60px;
}

.gallery h2{
    text-align:center;
    margin-bottom:30px;
}

.images{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}

.images img{
    width:100%;
    border-radius:15px;
}

footer{
    text-align:center;
    padding:30px;
    background:#000;
}

#clock{
    color:#00d4ff;
    margin-top:20px;
    font-size:1.2rem;
}
</style>

</head>

<body>

<section class="hero">
    <h1>🚀 SpaceX</h1>
    <p>Building the Future of Space Exploration</p>

```
<div id="clock"></div>

<a href="#stats" class="btn">Explore Missions</a>
```

</section>

<section class="stats" id="stats">
    <div class="card">
        <h2>450+</h2>
        <p>Starlink Launches</p>
    </div>

```
<div class="card">
    <h2>300+</h2>
    <p>Successful Missions</p>
</div>

<div class="card">
    <h2>100+</h2>
    <p>Rocket Landings</p>
</div>

<div class="card">
    <h2>Mars</h2>
    <p>Future Destination</p>
</div>
```

</section>

<section class="gallery">
    <h2>🚀 SpaceX Fleet</h2>

```
<div class="images">
    <img src="https://images.unsplash.com/photo-1516849841032-87cbac4d88f?auto=format&fit=crop&w=900&q=80">
    <img src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=900&q=80">
    <img src="https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?auto=format&fit=crop&w=900&q=80">
</div>
```

</section>

<footer>
    <h3>Built by Sarvesh Gugale</h3>
    <p>Flask • Docker • GitHub Actions • AWS EC2</p>
</footer>

<script>
function updateClock(){
    document.getElementById("clock").innerHTML =
    new Date().toLocaleString();
}
setInterval(updateClock,1000);
updateClock();
</script>

</body>
</html>
